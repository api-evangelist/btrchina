name: BTR New Material Group
description: BTR New Material Group Co., Ltd. (贝特瑞新材料集团股份有限公司) is a globally
  leading supplier of lithium-ion battery materials headquartered in China. The company produces anode
  materials for high-capacity batteries across soft-pack, aluminum-shell, and cylindrical formats;
  cathode materials for consumer electronics, power tools, energy storage, and electric vehicles; and
  advanced new materials used in smartphones, tablets, PCs, and displays. BTR operates a central research
  institute of roughly 50,000 square meters staffed by about 900 researchers. It is a portfolio company
  of Qiming Venture Partners. BTR is a materials manufacturer and publishes no developer API, documentation
  portal, or SDK surface; this profile captures its public web and domain-security footprint.
